<!doctype html>
<html><head><meta charset="utf-8">
<style>
	html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden;background:#0f0f0f}
	.c{position:relative;width:1024px;height:500px;background:radial-gradient(ellipse 60% 80% at 22% 50%,#18220e 0%,#0f0f0f 72%);font-family:'Segoe UI',Arial,sans-serif;color:#fff}
	svg.field{position:absolute;inset:0}
	.logo{position:absolute;left:40px;top:50%;width:380px;height:380px;transform:translateY(-50%);
		mix-blend-mode:lighten}
	.txt{position:absolute;left:440px;right:90px;top:50%;transform:translateY(-50%)}
	.brand{font-size:30px;font-weight:700;letter-spacing:.5px;color:#b8f34a;margin-bottom:14px}
	h1{margin:0;font-size:68px;line-height:1.02;font-weight:700;letter-spacing:-1px}
	p{margin:18px 0 26px;font-size:26px;line-height:1.3;color:#d6d9d2;font-weight:400}
	.chips{display:flex;gap:10px;flex-wrap:wrap}
	.chip{font-size:17px;font-weight:600;padding:7px 15px;border-radius:999px;border:1.5px solid rgba(184,243,74,.55);color:#e9fbc9;background:rgba(184,243,74,.08)}
</style></head>
<body><div class="c">
	<svg class="field" width="1024" height="500" viewBox="0 0 1024 500" fill="none" stroke="#b8f34a" stroke-opacity=".07" stroke-width="2">
		<rect x="430" y="30" width="560" height="440" rx="6"/>
		<line x1="710" y1="30" x2="710" y2="470"/>
		<circle cx="710" cy="250" r="70"/>
		<rect x="430" y="150" width="70" height="200"/>
		<rect x="920" y="150" width="70" height="200"/>
	</svg>
	<img class="logo" src="../images/Logo/1024-2.png">
	<div class="txt">
		<div class="brand">CanchApp</div>
		<h1>¿Te falta uno?</h1>
		<p>Armá tu partido y encontrá jugadores cerca tuyo en minutos.</p>
		<div class="chips">
			<span class="chip">Fútbol</span><span class="chip">Pádel</span><span class="chip">Tenis</span><span class="chip">Básquet</span><span class="chip">Vóley</span>
		</div>
	</div>
</div></body></html>
